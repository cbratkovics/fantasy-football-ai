name: weekly

# Autonomous weekly job: ingest nflverse -> contracts -> drift -> score champion ->
# shadow-evaluate challenger -> publish / hold / promote -> commit artifacts.
#
# NOTE: GitHub disables scheduled workflows after 60 days without repository activity. The commit
# this job makes on every PUBLISH/PROMOTE run is what keeps the schedule alive during the season.
# Off-season (Feb-Aug) the cron does not fire; use "Run workflow" to trigger manually.

on:
  schedule:
    # Tuesdays 10:00 UTC, September through January (nflverse stats for Monday night are in by then).
    - cron: "0 10 * 9-12,1 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (leave blank to detect from schedules)"
        required: false
      week:
        description: "Week to score (leave blank to detect)"
        required: false
      dry_run:
        description: "Compute but do not commit"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
          pip install -e .
      - name: Run the weekly job
        id: run
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ] && [ -n "${{ inputs.week }}" ]; then
            ARGS="--season ${{ inputs.season }} --week ${{ inputs.week }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          set +e
          python scripts/run_weekly.py $ARGS | tee weekly.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Read run outcome
        id: outcome
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, glob, os
          runs = sorted(glob.glob("artifacts/runs/run-*.json"))
          if runs:
              log = json.load(open(runs[-1]))
              print(f"action={log['action']}")
              print(f"season={log['season']}")
              print(f"week={log['week']:02d}")
              print(f"run_id={log['run_id']}")
          else:
              print("action=DRY_RUN"); print("season=0"); print("week=00"); print("run_id=none")
          EOF
      - name: Commit artifacts
        if: ${{ inputs.dry_run != true && steps.outcome.outputs.action != 'DRY_RUN' }}
        run: |
          git config user.name "weekly-job"
          git config user.email "weekly-job@users.noreply.github.com"
          git add artifacts docs/MODEL_CARD.md
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "weekly: ${{ steps.outcome.outputs.season }} wk${{ steps.outcome.outputs.week }} ${{ steps.outcome.outputs.action }}"
          git push
      - name: Mirror artifacts to the Hugging Face Space
        # The Space is a mirror of main's working tree (artifacts included); refreshed only
        # when something was published. HF_TOKEN is a repository secret with write scope.
        if: ${{ inputs.dry_run != true && (steps.outcome.outputs.action == 'PUBLISH' || steps.outcome.outputs.action == 'PROMOTE') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q "huggingface_hub[cli]"
          hf upload cbratkovics/fantasy-football-ai . . --repo-type space \
            --exclude ".git/*" --exclude ".venv/*" --exclude "data/*" --exclude "*.egg-info/*" \
            --exclude ".mypy_cache/*" --exclude ".ruff_cache/*" --exclude ".pytest_cache/*" \
            --exclude ".vscode/*" --exclude ".claude/*" --exclude "*.env*" \
            --exclude "frontend-next/node_modules/*" --exclude "frontend-next/.next/*"
      - name: Open an issue on HOLD
        if: ${{ steps.outcome.outputs.action == 'HOLD' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "weekly HOLD: ${{ steps.outcome.outputs.season }} wk${{ steps.outcome.outputs.week }} (${{ steps.outcome.outputs.run_id }})" \
            --label "weekly-hold" \
            --body-file weekly.log
      - name: Fail the job on HOLD so it is visible
        if: ${{ steps.outcome.outputs.action == 'HOLD' }}
        run: exit 1
