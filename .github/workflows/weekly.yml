name: weekly

# Autonomous weekly job: ingest nflverse -> contracts (dbt silver tests on MotherDuck) -> drift ->
# score champion -> shadow-evaluate challenger -> publish / hold / promote -> dbt build on
# MotherDuck -> export gold marts -> commit artifacts (incl. artifacts/marts) -> mirror the Space.
#
# MOTHERDUCK_TOKEN is a repository secret; it is used only here (one prod build per week, well
# inside the free tier's 10 compute-hours/month). The Space never receives it.
#
# NOTE: GitHub disables scheduled workflows after 60 days without repository activity. The commit
# this job makes on every PUBLISH/PROMOTE run is what keeps the schedule alive during the season.
# Off-season (Feb-Aug) the cron does not fire; use "Run workflow" to trigger manually.

on:
  schedule:
    # Tuesdays 10:00 UTC, September through January (nflverse stats for Monday night are in by then).
    - cron: "0 10 * 9-12,1 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (leave blank to detect from schedules)"
        required: false
      week:
        description: "Week to score (leave blank to detect)"
        required: false
      dry_run:
        description: "Compute but do not commit"
        type: boolean
        default: false
      full_refresh:
        description: "Rebuild the incremental silver stats table from scratch (ADR-0023: start of a season, model change, or a restatement older than the lookback)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-train.txt
            constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements-train.txt
          pip install -e .
      - name: Check publication content before artifact mirroring
        run: python scripts/check_publication.py
      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt
      - name: Run the weekly job
        id: run
        continue-on-error: true
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          FFAI_DBT_TARGET: prod
          FFAI_DBT_FULL_REFRESH: ${{ inputs.full_refresh == true && '1' || '' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ] && [ -n "${{ inputs.week }}" ]; then
            ARGS="--season ${{ inputs.season }} --week ${{ inputs.week }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          set +e
          python scripts/run_weekly.py $ARGS | tee weekly.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Read run outcome
        id: outcome
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, glob, os
          runs = sorted(glob.glob("artifacts/runs/run-*.json"))
          if runs:
              log = json.load(open(runs[-1]))
              print(f"action={log['action']}")
              print(f"season={log['season']}")
              print(f"week={log['week']:02d}")
              print(f"run_id={log['run_id']}")
          else:
              print("action=DRY_RUN"); print("season=0"); print("week=00"); print("run_id=none")
          EOF
      - name: Build the warehouse on MotherDuck and export the gold marts
        # After scoring, before the commit: the full medallion build with every test (the silver
        # contracts already ran inside the job; gold adds the contracts, the reconciliation to
        # the evaluation artifacts, and the unit tests), then COPY of every gold table to
        # artifacts/marts/*.parquet for the API. A failure here fails the run before anything is
        # committed, so a week is never published with marts that disagree with the artifacts.
        id: dbt
        if: ${{ inputs.dry_run != true && (steps.outcome.outputs.action == 'PUBLISH' || steps.outcome.outputs.action == 'PROMOTE') }}
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          VARS="{\"target_season\": ${{ steps.outcome.outputs.season }}, \"target_week\": $((10#${{ steps.outcome.outputs.week }}))}"
          FLAGS=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then FLAGS="--full-refresh"; fi
          dbt build --project-dir dbt --profiles-dir dbt --target prod --vars "$VARS" $FLAGS
          dbt run-operation export_gold --project-dir dbt --profiles-dir dbt --target prod
      - name: Export the Decision Lab bundle (after gold export, before the commit)
        # Rebuilds the offline Decision Lab bundle from the marts just exported plus the
        # prediction files and evaluation artifacts (ADR-0032). The exporter stages and verifies
        # both copies before replacing either destination, keeps the previous versions until the
        # final verification passes, and rolls both back on a caught failure. Exit 1: failed,
        # previous bundle and public copy re-established and verified (the site keeps the last
        # valid decision inputs; artifacts/decision_lab/_last_attempt.json records the attempt and
        # is committed with the artifacts). Exit 2: failed and the rollback could not be verified;
        # the commit step below then restores both paths from the last commit instead of staging
        # them. Either way an issue is opened and the artifact commit is not blocked.
        id: lab
        if: ${{ inputs.dry_run != true && (steps.outcome.outputs.action == 'PUBLISH' || steps.outcome.outputs.action == 'PROMOTE') }}
        continue-on-error: true
        run: |
          set +e
          python scripts/export_decision_lab.py --out artifacts/decision_lab --public-copy frontend-next/public/decision-lab
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Commit artifacts
        if: ${{ inputs.dry_run != true && steps.outcome.outputs.action != 'DRY_RUN' }}
        run: |
          git config user.name "weekly-job"
          git config user.email "weekly-job@users.noreply.github.com"
          if [ "${{ steps.lab.outputs.exit }}" = "2" ]; then
            # The exporter could not verify its rollback: put both bundle paths back to the last
            # committed (published) version so the commit and the Space mirror carry only evidence
            # that was already published, and never a partial copy.
            echo "Decision Lab restoration not established: restoring both bundle paths from HEAD"
            git checkout -- artifacts/decision_lab frontend-next/public/decision-lab
            git clean -fdq -- artifacts/decision_lab frontend-next/public/decision-lab
            rm -rf artifacts/decision_lab.build-* artifacts/decision_lab.previous-* \
              frontend-next/public/decision-lab.build-* frontend-next/public/decision-lab.previous-*
            python scripts/export_decision_lab.py --verify --out artifacts/decision_lab --public-copy frontend-next/public/decision-lab
          fi
          # Leftover .build-* / .previous-* siblings (an interrupted swap) are never staged.
          git add -- artifacts docs/MODEL_CARD.md frontend-next/public/decision-lab \
            ':(exclude)artifacts/decision_lab.*' ':(exclude)frontend-next/public/decision-lab.*'
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "weekly: ${{ steps.outcome.outputs.season }} wk${{ steps.outcome.outputs.week }} ${{ steps.outcome.outputs.action }}"
          git push
      - name: Mirror artifacts to the Hugging Face Space
        # The Space is a mirror of main's working tree (artifacts included); refreshed only
        # when something was published. HF_TOKEN is a repository secret with write scope.
        if: ${{ inputs.dry_run != true && (steps.outcome.outputs.action == 'PUBLISH' || steps.outcome.outputs.action == 'PROMOTE') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q "huggingface_hub[cli]"
          hf upload "$(python -m ffai.config hf_space)" . . --repo-type space \
            --exclude ".git/*" --exclude ".venv/*" --exclude "data/*" --exclude "*.egg-info/*" \
            --exclude ".mypy_cache/*" --exclude ".ruff_cache/*" --exclude ".pytest_cache/*" \
            --exclude ".vscode/*" --exclude ".claude/*" --exclude "*.env*" \
            --exclude "frontend-next/node_modules/*" --exclude "frontend-next/.next/*"
      - name: Ensure the notification label exists
        # Idempotent (--force updates an existing label); the HOLD / failure issues below must
        # never depend on repository setup. Run 2026-09-15T12:16Z failed here with
        # "could not add label: 'weekly-hold' not found".
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create weekly-hold --color D93F0B \
            --description "Opened by weekly.yml when a run HOLDs or the warehouse build fails" --force || true
      - name: Open an issue if the warehouse build failed
        if: ${{ failure() && steps.dbt.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "weekly: warehouse build failed for ${{ steps.outcome.outputs.season }} wk${{ steps.outcome.outputs.week }} (${{ steps.outcome.outputs.run_id }})" \
            --label "weekly-hold" \
            --body "dbt build --target prod (or export_gold) failed after scoring; nothing was committed. See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Open an issue if the Decision Lab export failed
        if: ${{ steps.lab.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "weekly: Decision Lab export failed for ${{ steps.outcome.outputs.season }} wk${{ steps.outcome.outputs.week }} (${{ steps.outcome.outputs.run_id }})" \
            --label "weekly-hold" \
            --body "scripts/export_decision_lab.py exited ${{ steps.lab.outputs.exit }} after the gold export. Exit 1: the previously published bundle and public copy were re-established and verified; the attempt is recorded in artifacts/decision_lab/_last_attempt.json (committed with the artifacts). Exit 2: the rollback could not be verified, so the commit step restored both paths from the last commit and re-verified them before staging; inspect the run log for the diagnostics. See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Open an issue on HOLD
        if: ${{ steps.outcome.outputs.action == 'HOLD' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "weekly HOLD: ${{ steps.outcome.outputs.season }} wk${{ steps.outcome.outputs.week }} (${{ steps.outcome.outputs.run_id }})" \
            --label "weekly-hold" \
            --body-file weekly.log
      - name: Fail the job on HOLD so it is visible
        if: ${{ steps.outcome.outputs.action == 'HOLD' }}
        run: exit 1
