name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_space:
        description: "Mirror the working tree to the Hugging Face Space"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements-train.txt
          pip install -e .
      - name: Lint
        run: |
          ruff check ffai tests scripts
          black --check ffai tests scripts
      - name: Tests (offline fixture; committed artifacts for the API tests)
        run: python -m pytest tests
      - name: Import check for the server
        run: python -c "import ffai.serve.app; print('ffai.serve.app importable')"

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t ffai-api:ci .
      - name: Report image size
        run: "docker image inspect ffai-api:ci --format 'ffai-api image size: {{.Size}} bytes'"
      - name: Smoke test /health
        run: |
          docker run -d --rm -p 7860:7860 --name ffai ffai-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7860/health && break; sleep 2; done
          curl -sf http://127.0.0.1:7860/health
          docker stop ffai

  dbt:
    # The analytics warehouse on the dev target only (a DuckDB file built from the committed
    # 40-player fixture and the committed artifacts). Never a prod / MotherDuck build here.
    #
    # Slim CI (ADR-0026): pushes to main do a full dev build and save its manifest + DuckDB file
    # to the Actions cache. Every other run restores that state and builds only
    # `state:modified+`, deferring unmodified upstream models to the restored file, so a change to
    # one gold model builds one gold model. No cached state (first run, or the cache evicted after
    # seven days without access) falls back to a full dev build.
    runs-on: ubuntu-latest
    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      DBT_VARS: '{"stats_path": "tests/fixtures/player_stats_sample.csv", "full_stats": false}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-train.txt
            constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements-train.txt
      - name: dbt deps
        run: dbt deps
      - name: Restore the last main dev build (slim-CI state)
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@v5
        with:
          path: .dbt-state
          key: dbt-dev-state-${{ github.sha }}
          restore-keys: dbt-dev-state-
      - name: dbt build (dev, fixture stats)
        # full_stats=false disables the baseline reconciliation, which needs the full nflverse
        # history; every other test, contract, unit test, snapshot, and the artifact reconciliation
        # run. --full-refresh keeps the incremental model deterministic on a restored file.
        run: |
          mkdir -p .duckdb
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ -f .dbt-state/manifest.json ] && [ -f .dbt-state/ffai_dev.duckdb ]; then
            echo "slim build: state:modified+ against main@$(cat .dbt-state/commit), deferring to its dev warehouse"
            cp .dbt-state/ffai_dev.duckdb .duckdb/ffai_dev.duckdb
            dbt build --target dev --vars "$DBT_VARS" --select state:modified+ --defer --state "$PWD/.dbt-state" --full-refresh
          else
            echo "full dev build (main, or no cached slim-CI state)"
            dbt build --target dev --vars "$DBT_VARS" --full-refresh
          fi
      - name: dbt source freshness (informational)
        run: dbt source freshness --target dev || true
      - name: sqlfluff
        run: sqlfluff lint dbt/models dbt/tests dbt/macros
      - name: dbt docs generate
        run: |
          dbt docs generate --target dev --static
          mkdir -p site && cp dbt/target/static_index.html site/index.html
      - name: Every model, column, source, and exposure is described (ADR-0021)
        run: python scripts/check_dbt_descriptions.py
      - name: Save this build as the slim-CI state (main only)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p .dbt-state
          cp dbt/target/manifest.json .dbt-state/manifest.json
          cp .duckdb/ffai_dev.duckdb .dbt-state/ffai_dev.duckdb
          git rev-parse HEAD > .dbt-state/commit
      - uses: actions/cache/save@v5
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          path: .dbt-state
          key: dbt-dev-state-${{ github.sha }}
      - name: Upload docs site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    # Publishes the dbt docs to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: dbt
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:7860

  deploy-space:
    # Manual only: "Run workflow" with deploy_space=true. Mirrors main to the Space with the same
    # exclusions the weekly job uses. Needs the HF_TOKEN repository secret (write scope).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_space }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q "huggingface_hub[cli]"
          pip install -q -e . --no-deps
          hf upload "$(python -m ffai.config hf_space)" . . --repo-type space \
            --exclude ".git/*" --exclude ".venv/*" --exclude "data/*" --exclude "*.egg-info/*" \
            --exclude ".mypy_cache/*" --exclude ".ruff_cache/*" --exclude ".pytest_cache/*" \
            --exclude ".vscode/*" --exclude ".claude/*" --exclude "*.env*" \
            --exclude "frontend-next/node_modules/*" --exclude "frontend-next/.next/*"
