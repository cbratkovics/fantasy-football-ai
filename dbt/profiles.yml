# Committed on purpose: no secret lives here. prod reads MOTHERDUCK_TOKEN from the environment
# (GitHub Actions secret for the weekly job; exported locally by the owner). The API never
# uses this file: it reads the parquet marts the weekly job exports (ADR-0018).
ffai_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      # FFAI_DUCKDB_PATH lets tests build into a scratch file (tests/test_dbt_incremental.py).
      path: "{{ env_var('FFAI_DUCKDB_PATH', '.duckdb/ffai_dev.duckdb') }}"
      schema: main
      threads: 4
      # DuckDB's own parallelism (dbt's `threads` only bounds model concurrency). Parallel
      # aggregation order is not deterministic, so exports differ at the 1e-15 level between
      # builds; FFAI_DUCKDB_THREADS=1 makes a build reproducible for checksum comparisons.
      settings:
        threads: "{{ env_var('FFAI_DUCKDB_THREADS', '4') | int }}"
    prod:
      type: duckdb
      # FFAI_MOTHERDUCK_DATABASE overrides the database only for scratch verification builds.
      path: "md:{{ env_var('FFAI_MOTHERDUCK_DATABASE', 'ffai') }}?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: main
      threads: 4
