version: 2

exposures:
  - name: api
    label: ffai FastAPI service (Hugging Face Space)
    type: application
    maturity: high
    url: https://cbratkovics-fantasy-football-ai.hf.space
    description: >
      The API serves the committed artifacts and, for the /marts/* routes, the parquet copies of
      these gold tables exported by the weekly build (artifacts/marts/*.parquet) — it never
      connects to MotherDuck. /performance still returns the evaluation artifacts verbatim.
    depends_on:
      - ref('fct_weekly_eval')
      - ref('fct_player_week')
      - ref('fct_decision_policy', v=1)
      - ref('dim_model_version')
    owner:
      name: Christopher Bratkovics
      email: cbratkovics@gmail.com

  - name: decision_lab_site
    label: Win My League Decision Lab (Next.js on Vercel)
    type: dashboard
    maturity: high
    url: https://www.winmyleague.ai
    description: >
      The site reads only the API. Its Decisions panel (floor-policy sweep) and the player
      history chart are driven by the gold marts through /marts/decisions and
      /marts/player_week/{player_id}; the published evaluation numbers come from the artifacts.
    depends_on:
      - ref('fct_decision_policy', v=1)
      - ref('fct_player_week')
      - ref('fct_weekly_eval')
    owner:
      name: Christopher Bratkovics
      email: cbratkovics@gmail.com

  - name: decision_lab
    label: Decision Lab offline bundle (frontend-next/public/decision-lab)
    type: application
    maturity: medium
    url: https://www.winmyleague.ai/decision-lab
    description: >
      The Decision Lab is a static bundle, not an API consumer: scripts/export_decision_lab.py
      reads the committed fct_player_week parquet (artifacts/marts) together with the prediction
      files and the evaluation artifacts, reconciles the full-data aggregates to those artifacts,
      and writes versioned inputs snapshots (never containing actuals) and separate outcome
      snapshots into artifacts/decision_lab, copied to frontend-next/public/decision-lab for the
      site (ADR-0032). The lab's baseline provenance prefers this table's baseline_source column
      when the parquet carries it and derives it by reconciliation otherwise. Display names and
      teams come from the period-specific prediction sources; dim_player is only the fallback
      (labelled display_source dim_player_current).
    depends_on:
      - ref('fct_player_week')
      - ref('dim_player')
    owner:
      name: Christopher Bratkovics
      email: cbratkovics@gmail.com
