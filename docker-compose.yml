# Local two-service stack: the artifact-backed API and the Next.js frontend.
# No database, cache, or worker is needed.
services:
  api:
    build: .
    ports:
      - "7860:7860"
    environment:
      FFAI_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend-next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:7860
    depends_on:
      api:
        condition: service_healthy
