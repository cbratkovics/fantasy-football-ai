[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffai"
version = "1.0.0"
description = "Fantasy football weekly point projections with as-of features, artifact-backed evaluation, and a no-database FastAPI server."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
train = [
  "nflreadpy>=0.1",
  "polars>=1.0",
  "pyarrow>=15",
  "xgboost>=2.0",
  "jinja2>=3.1",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
  "black>=24",
]

[tool.setuptools.packages.find]
include = ["ffai*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ffai/_legacy", "frontend-next", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "ffai/_legacy|frontend-next|\\.venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "network: needs nflverse download (skipped in CI unless cache present)",
]
